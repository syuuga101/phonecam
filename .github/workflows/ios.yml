name: Build iOS (unsigned IPA)

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test adaptive bitrate
        working-directory: ios
        run: |
          swiftc PhoneCam/AdaptiveBitrate.swift Tests/AdaptiveBitrateChecks.swift -o "$RUNNER_TEMP/phonecam-adaptive-checks"
          "$RUNNER_TEMP/phonecam-adaptive-checks"
          swiftc PhoneCam/LoopbackAddress.swift Tests/LoopbackChecks.swift -o "$RUNNER_TEMP/phonecam-loopback-checks"
          "$RUNNER_TEMP/phonecam-loopback-checks"

      - name: Test pair request rules
        working-directory: ios
        run: |
          swiftc PhoneCam/PairRequest.swift PhoneCam/Packet.swift Tests/PairRequestChecks.swift -o "$RUNNER_TEMP/phonecam-pair-checks"
          "$RUNNER_TEMP/phonecam-pair-checks"

      - name: Test handshake v2 (shared test vectors)
        working-directory: ios
        run: |
          swiftc PhoneCam/Secure.swift Tests/HandshakeChecks.swift -o "$RUNNER_TEMP/phonecam-handshake-checks"
          "$RUNNER_TEMP/phonecam-handshake-checks" ../docs/test-vectors/handshake-v2.json

      - name: Test recording session rules
        working-directory: ios
        run: |
          swiftc PhoneCam/RecordingSession.swift Tests/RecordingSessionChecks.swift -o "$RUNNER_TEMP/phonecam-recording-checks"
          "$RUNNER_TEMP/phonecam-recording-checks"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          VERSION=$(tr -d '[:space:]' < ../VERSION 2>/dev/null || echo 0.0.0)
          xcodebuild \
            -project PhoneCam.xcodeproj \
            -scheme PhoneCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            PHONECAM_REPO="${{ github.repository }}" \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          rm -rf Payload PhoneCam.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PhoneCam.app Payload/PhoneCam.app
          # 署名なしのままだと SideStore / AltStore が読み込めないことがあるため、
          # アドホック署名 (仮署名) とエンタイトルメントを付けておく。実際の署名は SideStore (AltStore) 側でやり直される
          # get-task-allow は外さない: 再署名後の値は SideStore (AltSign) が使うプロファイル由来で、AltSign は元アプリが持つこの値を必ず残す実装のため、
          # ここで外しても無料証明書の再署名後の値は変わらず、外す利点を確認できていない (2026-11 の監査 #22 の調査結果。PR を参照)
          cat > ent.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          PLIST
          plutil -lint ent.plist
          codesign --force --sign - --timestamp=none --generate-entitlement-der --entitlements ent.plist Payload/PhoneCam.app
          codesign -d --entitlements :- Payload/PhoneCam.app
          zip -qry PhoneCam.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCam-ipa
          path: ios/PhoneCam.ipa

