name: Build Windows receiver

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

env:
  # softcam (MIT, https://github.com/tshino/softcam) の固定バージョン
  SOFTCAM_TAG: v1.8.1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements.txt pyinstaller

      - name: Build exe
        shell: pwsh
        working-directory: windows
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PhoneCamReceiver --collect-all av --collect-all pyvirtualcam phonecam_receiver.py

      # ---- 専用仮想カメラ "PhoneCam" (softcam を改名してビルド) ----
      - name: Clone softcam
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:SOFTCAM_TAG https://github.com/tshino/softcam softcam-src
          if ($LASTEXITCODE -ne 0) { throw "softcam の取得に失敗しました" }

      - name: Patch softcam (name and CLSID)
        shell: pwsh
        working-directory: softcam-src
        run: |
          $ErrorActionPreference = "Stop"
          # 他の softcam と衝突しないよう、表示名・共有メモリ名・CLSID を PhoneCam 専用にする。
          # CLSID は windows/phonecam_receiver.py の PHONECAM_CLSID と一致させること。
          $newGuidText  = "BD7AEDAC-501F-4685-9B20-BC10F70BD144"
          $oldGuidText  = "AEF3B972-5FA5-4647-9571-358EB472BC9E"
          $oldGuidDef   = "0xaef3b972, 0x5fa5, 0x4647, 0x95, 0x71, 0x35, 0x8e, 0xb4, 0x72, 0xbc, 0x9e"
          $newGuidDef   = "0xbd7aedac, 0x501f, 0x4685, 0x9b, 0x20, 0xbc, 0x10, 0xf7, 0x0b, 0xd1, 0x44"

          function Patch-File($path, $pairs) {
            $text = [System.IO.File]::ReadAllText((Resolve-Path $path).Path)
            foreach ($pair in $pairs) {
              if (-not $text.Contains($pair[0])) { throw "パッチ対象の文字列が見つかりません: '$($pair[0])' in $path" }
              $text = $text.Replace($pair[0], $pair[1])
            }
            [System.IO.File]::WriteAllText((Resolve-Path $path).Path, $text)
          }

          Patch-File "src/softcam/softcam.cpp" @(
            @("DirectShow Softcam", "PhoneCam"),
            @($oldGuidText, $newGuidText),
            @($oldGuidDef, $newGuidDef)
          )
          Patch-File "src/softcamcore/DShowSoftcam.cpp" @(, @("DirectShow Softcam", "PhoneCam"))
          Patch-File "src/softcamcore/FrameBuffer.cpp"  @(, @("DirectShow Softcam", "PhoneCam"))

          # 検証
          $cpp = Get-Content "src/softcam/softcam.cpp" -Raw
          if ($cpp -notmatch 'L"PhoneCam"') { throw "表示名のパッチに失敗しました" }
          if ($cpp -match "(?i)AEF3B972") { throw "旧 CLSID が残っています" }
          if ($cpp -notmatch "(?i)0xbd7aedac") { throw "新 CLSID が入っていません" }
          if ((Get-Content "src/softcamcore/FrameBuffer.cpp" -Raw) -notmatch '"PhoneCam/SharedMemory"') { throw "共有メモリ名のパッチに失敗しました" }
          Write-Host "softcam をパッチしました"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build softcam (x64)
        shell: pwsh
        working-directory: softcam-src
        run: |
          $ErrorActionPreference = "Stop"
          # ソリューションの softcam ターゲットだけをビルドする (テストや NuGet を避ける)。依存プロジェクトも自動でビルドされる
          msbuild softcam.sln -t:softcam -p:Configuration=Release -p:Platform=x64 -m -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "softcam (x64) のビルドに失敗しました" }
          $dll = "dist/bin/x64/softcam.dll"
          if (-not (Test-Path $dll)) {
            $found = Get-ChildItem -Recurse -Filter softcam.dll | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
            if (-not $found) { throw "softcam.dll (x64) が見つかりません" }
            $dll = $found.FullName
          }
          New-Item -ItemType Directory -Force -Path ../softcam-out | Out-Null
          Copy-Item $dll ../softcam-out/softcam.dll
          Write-Host "x64: $dll"

      - name: Build softcam (Win32, optional)
        shell: pwsh
        working-directory: softcam-src
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          msbuild softcam.sln -t:softcam -p:Configuration=Release -p:Platform=Win32 -m -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "softcam (Win32) のビルドに失敗しました" }
          $dll = "dist/bin/Win32/softcam.dll"
          if (-not (Test-Path $dll)) { throw "softcam.dll (Win32) が見つかりません" }
          Copy-Item $dll ../softcam-out/softcam32.dll
          Write-Host "Win32: $dll"

      # ---- 配布フォルダを作る ----
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = "package/PhoneCamReceiver"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item windows/dist/PhoneCamReceiver.exe $pkg/
          Copy-Item softcam-out/softcam.dll $pkg/
          if (Test-Path softcam-out/softcam32.dll) { Copy-Item softcam-out/softcam32.dll $pkg/ }
          Copy-Item windows/register.bat $pkg/
          Copy-Item windows/unregister.bat $pkg/
          Get-ChildItem $pkg

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCamReceiver
          path: package/PhoneCamReceiver
          if-no-files-found: error
