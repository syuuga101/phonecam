name: Build Windows receiver

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_screens:
        description: "Qt のスクリーンショット (確認用) を撮らない。リリースのときは true"
        type: boolean
        default: false

env:
  # softcam (MIT, https://github.com/tshino/softcam) の固定バージョン
  SOFTCAM_TAG: v1.8.1

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            windows/requirements.txt
            windows/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r windows/requirements-test.txt

      - name: Run pytest
        working-directory: windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -ra

  build:
    needs: pytest
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements.txt pyinstaller==6.22.3

      # ---- 専用仮想カメラ "PhoneCam" (softcam を改名してビルド) ----
      # ビルド結果 (softcam-out) はタグ・パッチ・ビルドスクリプトが同じなら同じなので、キャッシュして毎回のビルドを省く。
      # 鍵に入れるもの: SOFTCAM_TAG と windows/softcam_ext/ の全ファイル (apply.ps1, build-slots.ps1, PhoneCamControls.h, REVISION)。
      # softcam.rev (下の Compute softcam revision) は同じ入力から毎回計算し直すので、キャッシュの有無で値は変わらない。
      # キャッシュのやり直しが要るときは鍵の "v1" を上げる。
      - name: Restore softcam build cache
        id: softcam_cache
        uses: actions/cache/restore@v4
        with:
          path: softcam-out
          key: softcam-${{ env.SOFTCAM_TAG }}-v1-${{ hashFiles('windows/softcam_ext/**') }}

      - name: Clone softcam
        if: steps.softcam_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:SOFTCAM_TAG https://github.com/tshino/softcam softcam-src
          if ($LASTEXITCODE -ne 0) { throw "softcam の取得に失敗しました" }

      - name: Setup MSBuild
        if: steps.softcam_cache.outputs.cache-hit != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Build four independent softcam filters (x64)
        if: steps.softcam_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./windows/softcam_ext/build-slots.ps1 -SoftcamDir softcam-src -OutputDir softcam-out

      - name: Build four independent softcam filters (Win32, optional)
        if: steps.softcam_cache.outputs.cache-hit != 'true'
        shell: pwsh
        continue-on-error: true
        run: ./windows/softcam_ext/build-slots.ps1 -SoftcamDir softcam-src -OutputDir softcam-out -Platform Win32

      # Win32 は任意なので、8 個 (4 スロット x 2 ビット数) そろったときだけ保存する (欠けたものを固定しないため)
      - name: Check softcam build is complete
        if: steps.softcam_cache.outputs.cache-hit != 'true'
        id: softcam_complete
        shell: pwsh
        run: |
          $n = @(Get-ChildItem softcam-out -Recurse -Include softcam.dll, softcam32.dll).Count
          Write-Host "softcam dll count: $n"
          "complete=$(if ($n -eq 8) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Save softcam build cache
        if: steps.softcam_cache.outputs.cache-hit != 'true' && steps.softcam_complete.outputs.complete == 'true'
        uses: actions/cache/save@v4
        with:
          path: softcam-out
          key: softcam-${{ env.SOFTCAM_TAG }}-v1-${{ hashFiles('windows/softcam_ext/**') }}

      # ---- softcam の版 (softcam.rev) ----
      # DLL は MSVC のリンク時刻・PDB の GUID でビルドごとに数バイト変わる (v2.2.1 と v2.3.0 は 24 バイトだけ違った)。
      # DLL のハッシュで「登録済みか」を判定すると、アプリを更新するたびに管理者権限の再登録が要ってしまう。
      # そこで softcam のソースを決めるもの (タグ・拡張パッチ・REVISION) だけから版を計算し、アプリはこの値で比べる。
      # CLSID/名前のパッチ (上の Patch softcam) やビルド設定を変えたら windows/softcam_ext/REVISION の数字を上げること。
      - name: Compute softcam revision
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ext = Join-Path $env:GITHUB_WORKSPACE "windows/softcam_ext"
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $text = "tag=$env:SOFTCAM_TAG`n"
          foreach ($f in @("apply.ps1", "build-slots.ps1", "PhoneCamControls.h", "REVISION")) {
            $text += "$f=" + ([System.IO.File]::ReadAllText((Join-Path $ext $f)) -replace "`r`n", "`n") + "`n"
          }
          $hash = ($sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($text)) | ForEach-Object { $_.ToString("x2") }) -join ""
          $rev = $hash.Substring(0, 12)
          [System.IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE "softcam-out/softcam.rev"), $rev)
          Write-Host "softcam revision: $rev"

      # ---- softcam の DLL を exe に埋め込んでビルド (配布物は PhoneCamReceiver.exe 1つだけ) ----
      - name: Build exe
        shell: pwsh
        working-directory: windows
        run: |
          $ErrorActionPreference = "Stop"
          $v = if (Test-Path ../VERSION) { (Get-Content ../VERSION -Raw).Trim() } else { "dev" }
          $repo = if ($env:GITHUB_REPOSITORY) { $env:GITHUB_REPOSITORY } else { "" }
          # セットアップウィザードの「iPhone用アプリをダウンロード」ボタンが使う (owner/name)
          Set-Content -Path phonecam_version.py -Value @("VERSION = '$v'", "REPO = '$repo'") -Encoding utf8
          $out = Join-Path $env:GITHUB_WORKSPACE "softcam-out"
          $dll64 = Join-Path $out "softcam.dll"
          if (-not (Test-Path $dll64)) { throw "softcam.dll (x64) がありません" }
          $bins = @("--add-binary", "$dll64;softcam")
          $bins += @("--add-data", "$(Join-Path $out 'softcam.rev');softcam")
          $dll32 = Join-Path $out "softcam32.dll"
          if (Test-Path $dll32) { $bins += @("--add-binary", "$dll32;softcam") } else { Write-Host "softcam32.dll は無いため 64bit のみ埋め込みます" }
          $qtPlugins = (& python -c "import pathlib, PySide6; print(pathlib.Path(PySide6.__file__).parent / 'plugins')").Trim()
          foreach ($slot in 2..4) {
            $path = Join-Path $out "$slot/softcam.dll"
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing softcam.dll for slot $slot" }
            $bins += @("--add-binary", "$path;softcam/$slot")
            $path32 = Join-Path $out "$slot/softcam32.dll"
            if (Test-Path -LiteralPath $path32) { $bins += @("--add-binary", "$path32;softcam/$slot") }
          }
          $qtBins = @(
            "--add-binary", "$(Join-Path $qtPlugins 'platforms/qwindows.dll');PySide6/plugins/platforms",
            "--add-binary", "$(Join-Path $qtPlugins 'imageformats/qsvg.dll');PySide6/plugins/imageformats",
            "--add-binary", "$(Join-Path $qtPlugins 'imageformats/qico.dll');PySide6/plugins/imageformats",
            "--add-binary", "$(Join-Path $qtPlugins 'iconengines/qsvgicon.dll');PySide6/plugins/iconengines",
            "--add-binary", "$(Join-Path $qtPlugins 'styles/qmodernwindowsstyle.dll');PySide6/plugins/styles"
          )
          # --exclude-module ではモジュールしか除けないので、.spec を作って、Qt の使わない DLL・プラグイン・翻訳などを
          # 名前で取り除く処理 (.github/scripts/slim_spec.py) を差し込んでからビルドする
          pyi-makespec --onefile --windowed --icon assets/icon.ico --name PhoneCamReceiver --collect-all av --collect-all qrcode --collect-all zeroconf --collect-all pyvirtualcam --collect-all sounddevice --collect-all _sounddevice_data --exclude-module tkinter --exclude-module _tkinter --hidden-import PIL.ImageDraw --hidden-import _cffi_backend --collect-submodules phonecam --add-data "locales;locales" --add-data "assets;assets" --hidden-import phonecam_setup --hidden-import phonecam_update --hidden-import phonecam_iphone --hidden-import phonecam_qr --hidden-import phonecam_audio --hidden-import phonecam_dshowctl --hidden-import phonecam_hotkeys @qtBins --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtMultimedia --exclude-module PySide6.QtMultimediaWidgets --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQuickWidgets @bins phonecam_qt.py
          if ($LASTEXITCODE -ne 0) { throw "pyi-makespec に失敗しました" }
          python ../.github/scripts/slim_spec.py PhoneCamReceiver.spec
          if ($LASTEXITCODE -ne 0) { throw "slim_spec.py に失敗しました" }
          python -m PyInstaller --noconfirm --clean PhoneCamReceiver.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller に失敗しました" }
          if (-not (Test-Path dist/PhoneCamReceiver.exe)) { throw "PhoneCamReceiver.exe が作成されませんでした" }

      # exe に何が何MB入っているかをログに出す (軽量化の確認用。失敗してもビルドは止めない)
      - name: List bundled files
        continue-on-error: true
        shell: pwsh
        run: |
          python .github/scripts/list_bundle.py windows/dist/PhoneCamReceiver.exe 70
          $exe = Get-Item windows/dist/PhoneCamReceiver.exe
          Write-Host ("PhoneCamReceiver.exe: {0:N2} MB" -f ($exe.Length / 1MB))

      # ---- 起動テスト: 出来上がった exe を実際に起動する (起動しない exe は自動更新でも直せないため) ----
      - name: Launch smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PHONECAM_SMOKE: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path windows/dist/PhoneCamReceiver.exe).Path
          $appdata = Join-Path $env:RUNNER_TEMP "smoke-appdata"
          Remove-Item -Recurse -Force $appdata -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $appdata "PhoneCam") | Out-Null
          $env:APPDATA = $appdata
          $logDir = Join-Path $appdata "PhoneCam"
          # ウィザード・更新確認が出ないように設定を事前に置く
          '{"setup_done": true, "setup_shown_version": "", "update_check": false}' | Set-Content -Path (Join-Path $logDir "phonecam_settings.json") -Encoding utf8
          $failed = $false
          function Show-Logs {
            foreach ($n in @("phonecam_crash.log", "phonecam_error.log", "selftest.txt")) {
              $f = Join-Path $logDir $n
              if (Test-Path $f) { Write-Host "---- $n ----"; Get-Content $f -Raw | Write-Host }
            }
          }
          function Has-Traceback {
            foreach ($n in @("phonecam_crash.log", "phonecam_error.log")) {
              $f = Join-Path $logDir $n
              if ((Test-Path $f) -and ((Get-Content $f -Raw) -match "Traceback")) { return $true }
            }
            return $false
          }

          # 1. 本体を起動して 15 秒生きているか
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Host "::error::exe が起動後 15 秒以内に終了しました (exit code $($p.ExitCode))"
            $failed = $true
          } else {
            Write-Host "exe は 15 秒後も動作中 (pid $($p.Id))"
            Stop-Process -Id $p.Id -Force
          }
          Show-Logs
          if (Has-Traceback) { Write-Host "::error::クラッシュ/エラーログに Traceback があります"; $failed = $true }

          # 2. --selftest (import・QR・QImage)
          $t = Start-Process -FilePath $exe -ArgumentList "--selftest" -PassThru
          if (-not $t.WaitForExit(90000)) { Stop-Process -Id $t.Id -Force; Write-Host "::error::--selftest が 90 秒で終わりませんでした"; $failed = $true }
          elseif ($t.ExitCode -ne 0) { Write-Host "::error::--selftest が失敗しました (exit code $($t.ExitCode))"; $failed = $true }
          else { Write-Host "--selftest 成功" }
          Show-Logs

          # 3. --setup-diagnose / --setup-wizard (Qt 版の診断とウィザード)。PHONECAM_SMOKE=1 では、画面を作って 3 秒後に
          #    「tkinter が読み込まれていないこと」を setup_smoke_<名前>.txt に記録して自分で閉じる (読み込まれていたら exit code 3)
          foreach ($mode in @("--setup-diagnose", "--setup-wizard")) {
            $name = $mode -replace '^--setup-', ''
            $d = Start-Process -FilePath $exe -ArgumentList $mode -PassThru
            if (-not $d.WaitForExit(60000)) {
              Stop-Process -Id $d.Id -Force
              Write-Host "::error::$mode が 60 秒で終わりませんでした (画面が開いて閉じるまでの動作を確認できません)"; $failed = $true
            }
            elseif ($d.ExitCode -ne 0) { Write-Host "::error::$mode が異常終了しました (exit code $($d.ExitCode))"; $failed = $true }
            else { Write-Host "$mode は正常終了" }
            $mark = Join-Path $logDir ("setup_smoke_" + $name + ".txt")
            if (Test-Path $mark) {
              $text = (Get-Content $mark -Raw).Trim()
              Write-Host "$mode : $text"
              if ($text -notmatch "tkinter loaded: False") { Write-Host "::error::$mode で tkinter が読み込まれています"; $failed = $true }
            } else { Write-Host "::error::$mode の確認ファイル ($mark) がありません"; $failed = $true }
            Show-Logs
            if (Has-Traceback) { Write-Host "::error::Traceback があります"; $failed = $true }
          }

          if ($failed) { throw "起動テストに失敗しました" }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCamReceiver
          path: windows/dist/PhoneCamReceiver.exe
          if-no-files-found: error

  # ---- Qt UI (PySide6) のスクリーンショット。移植中の確認用で、失敗してもリリースを止めない ----
  # リリース (release.yml) からの呼び出しでは撮らない (リリースの待ち時間を増やさないため)。
  # concurrency は付けない: 同じ group の待機中のジョブは新しい方に取り消され、呼び出し元の
  # Release が cancelled になりうる。ブランチへの保存は force push で、重なっても最後のものが残るだけ。
  qt-screenshots:
    if: ${{ github.event_name != 'pull_request' && !inputs.skip_screens }}
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements.txt

      # 倍率 1.0 / 2.0 (QT_SCALE_FACTOR を変えた子プロセス) x ライト/ダーク x 全ページ を撮る
      - name: Qt screenshots (windows platform)
        id: qt_windows
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: python windows/qt_smoke.py --out qt-screens

      # windows プラットフォームで撮れなかったときの代替 (offscreen)
      - name: Qt screenshots (offscreen fallback)
        if: steps.qt_windows.outcome == 'failure'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python windows/qt_smoke.py --out qt-screens

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-screens
          path: qt-screens
          if-no-files-found: warn

      # 確認用にスクショをブランチ qt-screens へ置く (artifact を直接取れない環境向け)
      - name: Push screenshots to branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          [ -d qt-screens ] || exit 0
          cd qt-screens
          git init -q -b qt-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "${GITHUB_SHA}" > SOURCE_SHA.txt
          git add -A
          git commit -q -m "Qt screenshots for ${GITHUB_SHA}"
          for i in 1 2 3; do
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" qt-screens && exit 0
            sleep 5
          done
          echo "::warning::スクショのブランチへの保存に失敗しました（他の実行と重なった可能性）"
          exit 0
