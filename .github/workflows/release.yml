name: Release

# VERSION ファイルを書き換えて main にコミットすると、そのバージョンでリリースを作る
on:
  push:
    branches: [main]
    paths:
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    uses: ./.github/workflows/ios.yml

  windows:
    uses: ./.github/workflows/windows.yml
    with:
      skip_screens: true

  release:
    needs: [ios, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # VERSION は x.y.z の形だけを受け付ける (後の手順でシェルやファイル名に使うため、それ以外は止める)
      - name: Read version
        id: ver
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION は x.y.z の形式にしてください"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: PhoneCam-ipa
          path: out

      - name: Download receiver
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: PhoneCamReceiver
          path: out

      # 更新マニフェスト (version と exe の SHA-256)。Secret UPDATE_SIGNING_KEY (Ed25519 の秘密鍵) があれば署名も付ける。
      # アプリに公開鍵が入るまでは、署名がなくてもアプリは今までどおり (GitHub のハッシュで) 更新できる。docs/release-signing.md
      - name: Create update manifest
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_KEY_ROTATION: ${{ vars.UPDATE_KEY_ROTATION }}
        run: python3 .github/scripts/make_update_manifest.py --exe out/PhoneCamReceiver.exe --version "$VERSION" --out out

      # SideStore / AltStore 共通のソース。releases/latest/download/sidestore-source.json (と従来の altstore-source.json) が
      # 常に最新のリリースを指す。2つは sourceURL 以外同じ内容
      - name: Generate SideStore / AltStore source
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 .github/scripts/make_altstore_source.py \
            --repo "$REPO" \
            --version "$VERSION" \
            --build "$RUN_NUMBER" \
            --ipa out/PhoneCam.ipa \
            --out out/altstore-source.json \
            --also-out out/sidestore-source.json

      - name: Validate source JSON
        run: python3 .github/scripts/check_source.py out/altstore-source.json out/sidestore-source.json

      # CHANGELOG.md から今回のバージョンの項目（"## v<ver>" から次の "## " の手前まで）を取り出す。
      # 見つからないときは既定の文章にする（リリース自体は止めない）
      - name: Prepare release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          awk -v ver="v${VERSION}" '
            /^## / {
              if (found) exit
              h = $2
              if (h == ver) { found = 1; next }
            }
            found && (started || $0 !~ /^[[:space:]]*$/) { started = 1; print }
          ' CHANGELOG.md > changes.md 2>/dev/null || true
          # 前後の空行を削る
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' changes.md || true
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "CHANGELOG.md に v${VERSION} の項目が見つかりませんでした。変更内容は下の「What's Changed」を見てください。" > changes.md
          fi
          {
            echo "## v${VERSION} の変更点"
            echo
            cat changes.md
            echo
            echo "---"
            echo
            echo "### インストール・アップデート"
            echo
            echo "- **Windows**: \`PhoneCamReceiver.exe\` をダウンロードして、古い exe と置き換えるだけです（初めての方はそのまま起動するとセットアップが始まります）。"
            echo "- **iPhone**: SideStore を開き、LocalDevVPN をオンにして Wi-Fi につないだ状態で、「My Apps」の PhoneCam を更新します（ソースは自動で最新になります）。"
            echo "- SideStore に追加する配布元: \`https://github.com/${REPO}/releases/latest/download/sidestore-source.json\` （これまでの \`altstore-source.json\` も引き続き使えます）"
            echo "- くわしい手順は [使い方ガイド](https://github.com/${REPO}/wiki) を見てください。"
            echo
            echo "---"
            echo
          } > release_body.md

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PhoneCam v${{ steps.ver.outputs.version }}
          body_path: release_body.md
          generate_release_notes: true
          make_latest: true
          files: |
            out/PhoneCam.ipa
            out/PhoneCamReceiver.exe
            out/altstore-source.json
            out/sidestore-source.json
            out/update-manifest.json
            out/update-manifest.json.sig
