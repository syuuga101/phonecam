name: Release

# VERSION ファイルを書き換えて main にコミットすると、そのバージョンでリリースを作る
on:
  push:
    branches: [main]
    paths:
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    uses: ./.github/workflows/ios.yml

  windows:
    uses: ./.github/workflows/windows.yml

  release:
    needs: [ios, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: PhoneCam-ipa
          path: out

      - name: Download receiver
        uses: actions/download-artifact@v4
        with:
          name: PhoneCamReceiver
          path: out

      # AltStore のソース。releases/latest/download/altstore-source.json が常に最新のリリースを指す
      - name: Generate AltStore source
        run: |
          python3 .github/scripts/make_altstore_source.py \
            --repo "${{ github.repository }}" \
            --version "${{ steps.ver.outputs.version }}" \
            --build "${{ github.run_number }}" \
            --ipa out/PhoneCam.ipa \
            --out out/altstore-source.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PhoneCam v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            out/PhoneCam.ipa
            out/PhoneCamReceiver.exe
            out/altstore-source.json
