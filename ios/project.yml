name: PhoneCam
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  PhoneCam:
    type: application
    platform: iOS
    sources:
      - path: PhoneCam
        excludes: [Info.plist]
    scheme: {}
    info:
      path: PhoneCam/Info.plist
      properties:
        CFBundleDisplayName: PhoneCam
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        PhoneCamRepo: "$(PHONECAM_REPO)"
        NSCameraUsageDescription: 配信用カメラとして使用します
        NSLocalNetworkUsageDescription: Wi-Fi経由でPCと接続するために使用します
        NSMicrophoneUsageDescription: iPhoneのマイク音声をPCへ送るため、録画に音声を入れるために使用します
        NSPhotoLibraryAddUsageDescription: 録画した動画を写真アプリに保存するために使用します
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.phonecam
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        PHONECAM_REPO: "syuuga101/phonecam"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
